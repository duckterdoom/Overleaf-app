[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-backend"
version = "0.1.0"
description = "LaTeX web backend with FastAPI, TeX compilation and PDF/DOCX services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "Pillow>=11,<13",
    "pypdf>=5,<7",
    "pdf2docx==0.5.13",
    "pymupdf==1.28.2",
    "python-docx>=1.2,<2",
    "pymongo>=4.19,<5",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.54,<1", "httpx>=0.28,<1", "google-auth>=2.38,<3", "requests>=2.32,<3"]
# Local browser mode does not require YAML configuration or auto-reload tooling.
web-local = ["websockets>=16,<18", "httpx>=0.28,<1", "google-auth>=2.38,<3", "requests>=2.32,<3"]
desktop = ["pywebview>=6,<7"]
mongo = ["pymongo>=4.19,<5"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "mongomock>=4.3,<5"]

[project.scripts]
latex-web = "latex_backend.entrypoints.web:main"
overleaf-web = "latex_backend.entrypoints.web:main"
overleaf-python = "latex_backend.entrypoints.desktop:main"
overleaf-server-python = "latex_backend.collaboration.network:server_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latex_backend = ["resources/templates/**/*", "resources/*.json", "pdf_export/original/*.py", "pdf_export/original/*.json", "pdf_export/original/extracted_figures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/latex_backend/pdf_export/original"]
