services:
  network:
    build:
      context: ../..
      dockerfile: deploy/python/Dockerfile
    ports:
      - "8080:8080"
    environment:
      OVERLEAF_HOST: 0.0.0.0
      OVERLEAF_PORT: 8080
      OVERLEAF_TOKEN: ${OVERLEAF_TOKEN:?Set a token with at least 24 characters}
      OVERLEAF_TLS_CERT: /certs/server-cert.pem
      OVERLEAF_TLS_KEY: /certs/server-key.pem
      OVERLEAF_MAX_CLIENTS: 64
      OVERLEAF_IDLE_TIMEOUT_MS: 60000
      OVERLEAF_QUEUE_CAPACITY: 32
      OVERLEAF_MAX_DOCUMENT_CHARS: 100000
    volumes:
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
